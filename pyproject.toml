[project]
name = "vektor-desk"
version = "1.0.1"
description = "Private investing desk for Escape Vektor, self-hosted on TrueNAS"
requires-python = ">=3.12"
dependencies = [
  "fastapi==0.150.0",
  "uvicorn==0.54.0",
  "google-auth==2.62.0",
  "requests==2.34.2",
  "pyyaml==6.0.3",
]

[project.optional-dependencies]
dev = [
  "pytest==9.1.1",
  "httpx==0.28.1",
  "ruff==0.17.1",
  "shellcheck-py==0.11.0.1",
]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["desk*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "--import-mode=importlib"

[tool.ruff]
line-length = 160
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S"]
ignore = ["S101", "S608"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S"]
