<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Risk · Vektor Desk</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:opsz,wght@9..40,400..800&family=League+Spartan:wght@500..800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/desk.css">
</head>
<body>
<main class="content" id="main"></main>
<script src="assets/data.js"></script>
<script src="assets/desk.js"></script>
<script src="assets/parts.js"></script>
<script>
DESK.page('lab', (main) => {
  const D = DATA, K = DESK;
  const { usd, pct, pts, ico, esc } = K;
  const rets = (v) => v.slice(1).map((x, i) => x / v[i] - 1);
  const vol = (v) => { const r = rets(v); const m = r.reduce((a, b) => a + b, 0) / r.length; return Math.sqrt(r.reduce((a, b) => a + (b - m) ** 2, 0) / r.length) * Math.sqrt(252); };
  const mdd = (v) => { let hi = v[0], dd = 0; v.forEach((x) => { hi = Math.max(hi, x); dd = Math.min(dd, x / hi - 1); }); return dd; };
  const ddSeries = (v) => { let hi = v[0]; return v.map((x) => { hi = Math.max(hi, x); return x / hi - 1; }); };
  const corr = (a, b) => { const x = rets(a), y = rets(b); const mx = x.reduce((s, v) => s + v, 0) / x.length, my = y.reduce((s, v) => s + v, 0) / y.length; let n = 0, dx = 0, dy = 0; x.forEach((v, i) => { n += (v - mx) * (y[i] - my); dx += (v - mx) ** 2; dy += (y[i] - my) ** 2; }); return n / Math.sqrt(dx * dy); };
  const div = (v, max = 1) => { const t = Math.max(-1, Math.min(1, v / max)); const c = t >= 0 ? 'var(--up)' : 'var(--dn)'; return { fill: `color-mix(in oklab, ${c} ${Math.round(Math.abs(t) * 100)}%, var(--mid))`, ink: Math.abs(t) > 0.55 ? '#fff' : 'var(--ink)' }; };

  main.insertAdjacentHTML('beforeend', K.hero({
    kicker: 'Lab · Risk and statistics', title: 'Risk', art: 'lab',
    big: `<b>${pct(mdd(D.port))}</b><span class="muted">worst drop in the last year</span>`,
    foot: `${K.subtabs('lab')}<button class="btn sm ghost" type="button">${ico('pin')}Save as a board</button>`,
  }));
  K.slicers(main, { period: '1Y' });
  const k = document.createElement('section');
  k.className = 'kpis';
  k.innerHTML = [
    K.kpi({ id: 'v', metric: 'risk.vol', label: 'Volatility', value: pct(vol(D.port)), line: '252-day, annualized' }),
    K.kpi({ id: 's', metric: 'risk.sharpe', label: 'Sharpe', value: '0.71', line: 'Plan shadow 0.78' }),
    K.kpi({ id: 'b', metric: 'risk.beta', label: 'Beta', value: '1.14', line: 'To the S&P 500' }),
    K.kpi({ id: 'n', metric: 'risk.eff_n', label: 'Effective holdings', value: '3.4', line: 'Of 8 positions' }),
    K.kpi({ id: 'l', metric: 'risk.lookthrough', label: 'Largest look-through', value: '9.8%', line: 'AAPL, direct and in funds' }),
    K.kpi({ id: 'var', metric: 'risk.var95', label: 'Bad month', value: '−$3,120', line: '1 in 20, historical', quality: 'pro forma' }),
  ].join('');
  main.append(k);
  main.insertAdjacentHTML('beforeend', `<section class="grid">
    <div class="card c6"><div class="card-head"><span class="tag">Return against risk</span><span class="chip">Click a dot</span></div><div class="legend"><span><i class="dot" style="--c:var(--s1)"></i>Holdings</span><span><i class="dot" style="--c:var(--s2)"></i>Your portfolio</span><span><i class="dot" style="--c:var(--s3)"></i>Plan shadow</span></div><div id="sc"></div></div>
    <div class="card c6"><div class="card-head"><span class="tag coral">How they move together</span><span class="chip">Daily returns, 1 year</span></div><div id="cor"></div><div class="scale">Opposite<i></i>Together</div></div>
    <div class="card c6"><div class="card-head"><span class="tag mustard">Drawdown from the high</span></div><div id="dd"></div></div>
    <div class="card c6"><div class="card-head"><span class="tag sky">Scenario shocks</span><span class="chip">Today's weights</span></div><div id="shock"></div><p class="empty-hint" style="margin-top:6px">Dollars lost if it happened again tomorrow. Margin call needs a 97% drop.</p></div>
    <div class="card c6"><div class="card-head"><span class="tag lilac">What you really own</span><span class="chip">Look-through, top 8</span></div><div id="look"></div></div>
    <div class="card c6"><div class="card-head"><span class="tag mint">Month by month</span><span class="chip">Return by holding</span></div><div id="cal"></div><div class="scale">Down<i></i>Up</div></div>
  </section>`);
  const dots = D.H.map((h) => { const v = D.SYM[h.sym].series; return { label: h.sym, x: vol(v), y: v[v.length - 1] / v[0] - 1, color: 'var(--s1)', sym: h.sym }; });
  dots.push({ label: 'You', x: vol(D.port), y: D.port[D.port.length - 1] / D.port[0] - 1, color: 'var(--s2)', r: 8, left: true, dy: -6 });
  dots.push({ label: 'Plan', x: vol(D.planShadow), y: D.planShadow[D.planShadow.length - 1] / D.planShadow[0] - 1, color: 'var(--s3)', r: 8, left: true, dy: 8 });
  K.scatter(main.querySelector('#sc'), { points: dots, height: 270, xName: 'Volatility', yName: 'Return, 1 year', fmtX: (v) => pct(v, 0), fmtY: (v) => pct(v, 0) });
  const syms = ['FSKAX', 'FTIHX', 'FTEC', 'UFO', 'AAPL', 'RIVN', 'SPY'];
  K.heatmap(main.querySelector('#cor'), { rows: syms, cols: syms, values: syms.map((a) => syms.map((b) => (a === b ? null : corr(D.SYM[a].series, D.SYM[b].series)))), color: (v) => div(v), fmt: (v) => v.toFixed(2), showVals: true, name: 'Correlation', cellH: 30 });
  K.lineChart(main.querySelector('#dd'), { height: 220, x: D.days, series: [{ name: 'Portfolio', color: 'var(--s1)', values: ddSeries(D.port) }, { name: 'Plan shadow', color: 'var(--s2)', values: ddSeries(D.planShadow) }], fmtY: (v) => pct(v, 0), fmtTip: (v) => pct(v, 1), zero: true, label: 'Drawdown' });
  const val = D.total;
  K.hbars(main.querySelector('#shock'), { items: [['2008 replay', -0.41], ['March 2020 replay', -0.3], ['2022 replay', -0.24], ['Market −20%', -0.22], ['Single stocks −50%', -0.038], ['Rates +2 points', -0.07]].map(([l, p]) => ({ label: l, value: p * val })), fmt: (v) => usd(v), name: 'Loss', labelW: 140 });
  K.hbars(main.querySelector('#look'), { items: [['AAPL', 0.098], ['NVDA', 0.064], ['MSFT', 0.061], ['RIVN', 0.029], ['AMZN', 0.022], ['AVGO', 0.019], ['GOOGL', 0.018], ['META', 0.014]].map(([l, p]) => ({ label: l, value: p, color: l === 'AAPL' || l === 'RIVN' ? 'var(--s1)' : 'var(--s-other)' })), fmt: (v) => pct(v), name: 'Weight', labelW: 70, legendHtml: '<div class="legend"><span><i class="dot" style="--c:var(--s1)"></i>Also held directly</span><span><i class="dot" style="--c:var(--s-other)"></i>Only inside funds</span></div>' });
  const months = ['Dec', 'Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov'];
  const mret = (v) => months.map((_, m) => { const a = Math.floor(m * 21), b = Math.min(v.length - 1, a + 21); return v[b] / v[a] - 1; });
  const hs = ['FSKAX', 'FTIHX', 'FTEC', 'UFO', 'AAPL', 'RIVN'];
  K.heatmap(main.querySelector('#cal'), { rows: hs, cols: months, values: hs.map((s) => mret(D.SYM[s].series)), color: (v) => div(v, 0.12), fmt: (v) => pct(v, 1, true), name: 'Month return', cellH: 28 });
});
</script>
</body>
</html>
