<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Settings · Vektor Desk</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:opsz,wght@9..40,400..800&family=League+Spartan:wght@500..800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/desk.css">
</head>
<body>
<main class="content" id="main"></main>
<script src="assets/data.js"></script>
<script src="assets/desk.js"></script>
<script src="assets/parts.js"></script>
<script>
DESK.page('settings', (main) => {
  const D = DATA, K = DESK;
  const { usd, pct, pts, ico, esc } = K;
  main.insertAdjacentHTML('beforeend', K.hero({
    kicker: 'Settings · Desk profile v14', title: 'Settings', art: 'settings',
    big: '<b>5 of 6</b><span class="muted">desks on · token renews Nov 3, 2027</span>',
    foot: '<span class="chip ok">All data fresh</span><span class="chip">Proposals record the profile version</span>',
  }));
  main.insertAdjacentHTML('beforeend', `<section class="grid">
    <div class="card c6"><div class="card-head"><span class="tag mustard">Desk profile</span><span class="acts"><span class="chip">desk.yaml · v14 · Oct 2</span></span></div>
      <div class="form">
        <div class="slider"><span>Risk level</span><input type="range" min="1" max="5" value="3" aria-label="Risk level"><output>3 of 5</output></div>
        <div class="slider"><span>Satellite cap</span><input type="range" min="0" max="20" value="10" aria-label="Satellite cap"><output>10%</output></div>
        <div class="slider"><span>Harvest at</span><input type="range" min="0" max="1000" step="50" value="250" aria-label="Harvest threshold"><output>$250</output></div>
        <div class="slider"><span>Horizon</span><input type="range" min="5" max="30" value="15" aria-label="Horizon"><output>15 yrs</output></div>
        <div id="combos" style="display:flex;gap:8px;flex-wrap:wrap"></div>
        <div><span class="kicker">Industry focus</span><div style="display:flex;gap:6px;flex-wrap:wrap;margin-top:6px"><span class="chip info">Space · 40</span><span class="chip info">Nuclear · 30</span><span class="chip info">Semiconductors · 30</span><span class="chip">Excluded: tobacco</span><button class="chip" type="button">${ico('plus')}Add</button></div></div>
        <div class="note">${ico('info')}<span>Saving makes v15. Changing a rule is logged as a decision and scored like one.</span></div>
      </div>
    </div>
    <div class="stack c6">
      <div class="card"><div class="card-head"><span class="tag coral">All desks</span><span class="acts"><span class="muted" style="font-size:12.5px">Kill switch</span><button class="switch" role="switch" aria-checked="true" aria-label="All desks on"></button></span></div><p class="muted" style="font-size:12.5px">Off stops every scheduled run at once. Proposals already in the queue stay.</p></div>
      <div class="card"><div class="card-head"><span class="tag">Usage this week</span><span class="chip">Turns · budget 180</span></div><div id="use"></div></div>
    </div>
  </section>
  <section class="card"><div class="card-head"><span class="tag mint">Crew</span><span class="chip">Overnight window 1:00 to 6:00 AM ET</span></div><div class="crew" id="crew"></div></section>
  <section class="grid">
    <div class="card c6"><div class="card-head"><span class="tag sky">Data freshness</span></div><div id="fresh"></div></div>
    <div class="card c6"><div class="card-head"><span class="tag lilac">Phone alerts</span><span class="chip">ntfy on TrueNAS</span></div><div id="alerts"></div></div>
  </section>`);
  const cb = main.querySelector('#combos');
  cb.append(K.combo('Tilt', ['Growth', 'Balanced', 'Income'], 'Growth'), K.combo('Lot method', ['Highest cost first', 'Lowest cost first', 'FIFO'], 'Highest cost first'), K.combo('Avoid', ['Short-term gains', 'Nothing'], 'Short-term gains'));
  const crew = [['plan', 'Plan keeper', 'sonnet · medium', 'Today 5:30 PM', 'Tonight 5:30 PM', 38, 50, true], ['tax', 'Tax desk', 'sonnet · high', 'Sun 2:00 AM', 'Sun 2:00 AM', 22, 30, true], ['risk', 'Risk desk', 'sonnet · high', 'Sat 2:00 AM', 'Sat 2:00 AM', 19, 25, true], ['research', 'Research desk', 'opus · high', 'Wed 1:00 AM', 'Tonight 1:00 AM · NuScale', 61, 50, true], ['scout', 'Scout', 'opus · high', 'Nov 1 3:00 AM', 'Dec 6 3:00 AM', 12, 25, false], ['skeptic', 'Skeptic', 'sonnet · high', 'Thu 1:40 AM', 'After a buy or sell', 9, 20, true]];
  main.querySelector('#crew').innerHTML = crew.map(([k, n, m, last, next, used, cap, on]) => `<div><span style="display:flex;justify-content:space-between;align-items:center"><span class="desk-ico ${k}" style="width:34px;height:34px;border-radius:10px">${ico(K.DESK_ICO[k])}</span><button class="switch" role="switch" aria-checked="${on}" aria-label="${n} on"></button></span><b>${n}</b><small>${m}</small><small>Last: ${last}<br>Next: ${on ? next : 'Off'}</small><div class="meter"><i style="width:${Math.min(100, (used / cap) * 100)}%;background:${used > cap ? 'var(--mustard)' : 'var(--teal)'}"></i></div><small>${used} of ${cap} turns${used > cap ? ' · over, next run waits' : ''}</small></div>`).join('');
  K.hbars(main.querySelector('#use'), { items: crew.map((c) => ({ label: c[1], value: c[5], ref: c[6], color: c[5] > c[6] ? 'var(--s4)' : 'var(--s1)' })), fmt: (v) => `${v} turns`, name: 'Turns', labelW: 110, valueW: 76, legendHtml: '<div class="legend"><span><i style="--c:var(--ink);width:2px;height:12px"></i>Weekly cap</span></div>' });
  main.querySelector('#fresh').innerHTML = [['ok', 'Mirror from Escape Vektor', 'Today 8:00 AM · next 5:00 PM'], ['ok', 'Live prices', 'Finnhub · 11:42:08 AM'], ['ok', 'Lot export', 'Nov 1 · drop the next one by Dec 1'], ['ok', 'SEC EDGAR and FRED', 'Nightly · 2:14 AM'], ['watch', 'Claude token', 'Created Nov 3, 2026 · renew by Nov 3, 2027']].map(([t, a, b]) => `<div class="rule"><span style="color:var(--${t})">${ico(t === 'ok' ? 'check' : 'clock')}</span><span><b>${a}</b><small>${b}</small></span><span class="chip ${t}">${t === 'ok' ? 'Fresh' : '361 days'}</span></div>`).join('');
  main.querySelector('#alerts').innerHTML = [['Rule about to break', true], ['Invalidation trigger hit', true], ['Wash-sale window opens or closes', true], ['Research ready', false], ['Mirror stale over 14 hours', true]].map(([t, on]) => `<div class="rule"><span style="color:var(--teal-ink)">${ico('bolt')}</span><span><b>${t}</b></span><button class="switch" role="switch" aria-checked="${on}" aria-label="${t}"></button></div>`).join('');
  main.querySelectorAll('.switch').forEach((s) => (s.onclick = () => s.setAttribute('aria-checked', s.getAttribute('aria-checked') === 'true' ? 'false' : 'true')));
});
</script>
</body>
</html>
