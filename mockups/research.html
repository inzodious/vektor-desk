<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Research · Vektor Desk</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:opsz,wght@9..40,400..800&family=League+Spartan:wght@500..800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/desk.css">
</head>
<body>
<main class="content" id="main"></main>
<script src="assets/data.js"></script>
<script src="assets/desk.js"></script>
<script src="assets/parts.js"></script>
<script>
DESK.page('research', (main) => {
  const D = DATA, K = DESK;
  const { usd, pct, pts, ico, esc } = K;
  main.insertAdjacentHTML('beforeend', K.hero({
    kicker: 'Research · Dossiers', title: 'Research', art: 'research',
    big: '<b>14</b><span class="muted">dossiers · 1 deep dive queued for tonight</span>',
    foot: `${K.subtabs('research')}<button class="btn sm" type="button" data-console-open>${ico('telescope')}Request a deep dive</button>`,
  }));
  main.querySelector('[data-console-open]').onclick = K.openConsole;
  K.slicers(main, { period: '1Y', bench: false, extra: [K.combo('Show', ['Holdings and themes', 'Holdings', 'Themes', 'Watchlist'], 'Holdings and themes'), K.combo('Sort', ['Recently updated', 'Oldest first', 'Biggest position'], 'Recently updated')] });
  main.insertAdjacentHTML('beforeend', `<section class="grid">
    <div class="stack c4">
      <div class="card"><div class="card-head"><span class="tag lilac">Dossiers</span><span class="chip">Refreshed weekly in rotation</span></div><div class="rows" id="dlist"></div></div>
      <div class="card"><div class="card-head"><span class="tag sky">Watchlist</span><button class="link" type="button">Add a symbol</button></div><div class="rows" id="watch"></div></div>
    </div>
    <div class="stack c8">
      <div class="card">
        <div class="card-head"><span style="display:grid;gap:2px"><span class="kicker">Research desk · refreshed Nov 5 · 9 sources</span><h2 style="font-size:24px"><a href="#" data-sym="FTEC" class="sym" style="font-size:24px"><i style="--c:var(--s1)"></i>FTEC</a> · Tech tilt</h2></span><span class="acts"><span class="chip ok">Hold in band</span><button class="btn sm ghost" type="button">${ico('plus')}Add a note</button><button class="btn sm" type="button" data-console-open2>${ico('play')}Refresh now</button></span></div>
        <div class="split">
          <div><span class="kicker">Valuation range · forward P/E of the fund</span><div class="range"><span class="lab" style="left:12%">24x</span><span class="lab" style="left:50%">29x fair</span><span class="lab" style="left:88%">35x</span><span class="bar" style="left:12%;width:76%"></span><span class="now" style="left:72%" title="Now 32x"></span></div><p class="empty-hint">Now 32x: inside the range, upper half.</p></div>
          <div class="bb"><div class="bull"><b>Thesis</b>${K.THESIS.FTEC[0]}</div><div class="bear"><b>Bear case</b>${K.THESIS.FTEC[1]}</div></div>
        </div>
      </div>
      <div class="grid" style="gap:14px">
        <div class="card c7"><div class="card-head"><span class="tag">FTEC against US core</span><span class="chip">Rebased to 100</span></div><div id="px"></div></div>
        <div class="card c5"><div class="card-head"><span class="tag mustard">What would change the call</span></div><div id="change"></div></div>
      </div>
      <div class="card"><div class="card-head"><span class="tag">Key numbers</span><span class="chip">From the engine, Nov 6 close</span></div><div class="kv" id="kv"></div></div>
      <div class="grid" style="gap:14px">
        <div class="card c6"><div class="card-head"><span class="tag sky">Filings and events</span><span class="chip">SEC EDGAR · Finnhub</span></div><div class="rows" id="filings"></div></div>
        <div class="card c6"><div class="card-head"><span class="tag lilac">Sources</span><span class="chip">Every claim links here</span></div><div id="srcs"></div></div>
      </div>
    </div>
  </section>`);
  main.querySelector('[data-console-open2]').onclick = K.openConsole;
  main.querySelector('#dlist').innerHTML = D.DOSSIERS.map((d, i) => `<div class="row" style="${i === 0 ? 'background:var(--track)' : ''}"><span class="l"><span class="desk-ico research" style="width:32px;height:32px;border-radius:10px">${ico(d.sym === 'SMR' ? 'layers' : 'book')}</span><div><b>${d.title}</b><small>Updated ${d.updated} · ${d.sources} sources</small></div></span><span class="chip ${d.tone}">${d.verdict}</span></div>`).join('');
  main.querySelector('#watch').innerHTML = [['SMR', 'Trigger: below $21.00', 'Nuclear theme'], ['VXUS', 'Trigger: none', 'Compared with FTIHX']].map(([s, t, n]) => { const x = D.SYM[s]; const c = x.px / x.prev - 1; return `<div class="row" data-sym="${s}"><span class="l"><span class="sym"><i style="--c:var(--s3)"></i>${s}</span><div><small>${n} · ${t}</small></div></span><span class="v">$${K.px(x.px)}<small class="${c >= 0 ? 'up' : 'dn'}" style="display:block">${pct(c, 2, true)}</small></span></div>`; }).join('');
  const reb = (v) => v.map((x) => (x / v[0]) * 100);
  K.lineChart(main.querySelector('#px'), { height: 200, x: D.days, series: [{ name: 'FTEC', color: 'var(--s1)', values: reb(D.SYM.FTEC.series) }, { name: 'FSKAX', color: 'var(--s2)', values: reb(D.SYM.FSKAX.series) }], refs: [{ y: 100 }], fmtY: (v) => v.toFixed(0), endLabels: true });
  main.querySelector('#change').innerHTML = [['Top three weights pass 50%', 'Now 45%. Concentration risk becomes the story.', 'watch'], ['Forward P/E above 35x', 'Now 32x. Trim back to target, not out.', 'info'], ['Plan drops the tech tilt', 'Then it folds into US core by deposit.', 'info']].map(([t, s, c]) => `<div class="rule"><span style="color:var(--${c})">${ico('flag')}</span><span><b>${t}</b><small>${s}</small></span><span></span></div>`).join('');
  main.querySelector('#kv').innerHTML = [['Expense ratio', '0.084% · $5 a year'], ['Top 3 weight', '45%'], ['Overlap with FSKAX', '31% of FTEC'], ['1-year return', pct(D.SYM.FTEC.px / D.SYM.FTEC.series[0] - 1, 1, true)], ['52-week range', 'Upper 20%'], ['Vs 200-day average', '+8.4%'], ['Yield', '0.5%'], ['Your weight', pct(D.H.find((h) => h.sym === 'FTEC').weight)]].map(([a, b]) => `<div><small>${a}</small><b>${b}</b></div>`).join('');
  main.querySelector('#filings').innerHTML = [['Nov', 4, 'N-PORT holdings, Sep 30', 'Top 3 weight up 2 points'], ['Oct', 29, 'AAPL 10-K (top holding)', 'Services up, hardware flat'], ['Oct', 22, 'Form 4 · NVDA director sale', 'Planned sale, under 1% of holdings'], ['Dec', 19, 'Distribution (estimated)', 'Last year $0.41 a share']].map(([m, d, t, s]) => `<div class="row"><span class="l"><span class="datebox"><small>${m}</small><b>${d}</b></span><div><b>${t}</b><small>${s}</small></div></span><span></span></div>`).join('');
  main.querySelector('#srcs').innerHTML = [['Primary', 'N-PORT filing, Sep 30 · SEC EDGAR', 'Nov 4'], ['Primary', 'Fund fact sheet · Fidelity', 'Oct 31'], ['Primary', '10-Y Treasury yield · FRED', 'Nov 5'], ['Web', 'Sector earnings recap · trade press', 'Nov 2'], ['Note', 'Your note: keep the tilt at 12%, no higher', 'Sep 12']].map(([k, t, d]) => `<div class="src"><span class="chip ${k === 'Primary' ? 'ok' : k === 'Note' ? 'lilac' : ''}">${k}</span><a href="#">${t}</a><span class="muted" style="margin-left:auto;font-size:11.5px;white-space:nowrap">${d}</span></div>`).join('');
});
</script>
</body>
</html>
