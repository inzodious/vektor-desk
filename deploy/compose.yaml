# Vektor Desk on TrueNAS SCALE: Apps → Discover Apps → ⋮ → Install via YAML, name it "vektor-desk" (docs/setup.md, step 6).
# Private: caddy answers on the tailscale service's own tailnet address (https://desk.escape-vektor.com) and on the NAS's
# LAN alias 192.168.0.116 (https://desk-lan.escape-vektor.com, docs/setup.md "Home network"). Your router forwards neither.
services:
  tailscale:
    image: tailscale/tailscale:v1.102.4
    container_name: vektor-desk-tailscale
    hostname: desk
    restart: unless-stopped
    environment:
      TS_HOSTNAME: desk
      TS_STATE_DIR: /var/lib/tailscale
      TS_USERSPACE: "false"
      TS_ACCEPT_DNS: "false"
      TS_EXTRA_ARGS: --advertise-tags=tag:desk
    # TS_AUTHKEY, only needed for the first sign-in; the node's state is kept in tailscale/ after that.
    env_file: /mnt/Manifest/apps/vektor-desk/tailscale.env
    volumes:
      - /mnt/Manifest/apps/vektor-desk/tailscale:/var/lib/tailscale
    devices:
      - /dev/net/tun:/dev/net/tun
    cap_add: [NET_ADMIN, NET_RAW]
    # Caddy shares this service's network, so its LAN ports are published here, on the alias only. Change both lines if
    # you pick another alias.
    ports:
      - "192.168.0.116:443:443"
      - "192.168.0.116:8443:8443"
    mem_limit: 96m

  caddy:
    image: vektor-desk/caddy:local
    pull_policy: never
    container_name: vektor-desk-caddy
    restart: unless-stopped
    # Lives in the tailscale service's network: its tailnet address, plus the LAN ports that service publishes on the alias.
    network_mode: service:tailscale
    depends_on: [tailscale, api, ntfy]
    environment:
      DESK_DOMAIN: desk.escape-vektor.com
      DESK_LAN_DOMAIN: desk-lan.escape-vektor.com
    # PORKBUN_API_KEY and PORKBUN_API_SECRET_KEY, for the certificate's DNS check.
    env_file: /mnt/Manifest/apps/vektor-desk/caddy.env
    volumes:
      - /mnt/Manifest/apps/vektor-desk/caddy/data:/data
      - /mnt/Manifest/apps/vektor-desk/caddy/config:/config
    mem_limit: 96m

  api:
    image: vektor-desk:local
    pull_policy: never
    container_name: vektor-desk-api
    restart: unless-stopped
    init: true
    user: "568:568"
    environment:
      DESK_NTFY_URL: http://ntfy:8080
    # DESK_FIREBASE_PROJECT, DESK_UID, DESK_CLAUDE_TOKEN_EXPIRES: settings, no secrets.
    env_file: /mnt/Manifest/apps/vektor-desk/settings.env
    volumes:
      - /mnt/Manifest/apps/vektor-desk/data:/data
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 256m

  # The schedule in deploy/crontab: the mirror, and the engine and agents once they land. The only service with the Claude
  # token and the Firestore key.
  cron:
    image: vektor-desk:local
    pull_policy: never
    container_name: vektor-desk-cron
    restart: unless-stopped
    init: true
    user: "568:568"
    command: ["python", "-m", "desk.scheduler", "/app/deploy/crontab"]
    environment:
      DESK_FIRESTORE_CREDENTIALS: /run/secrets/firestore-reader
      DESK_NTFY_URL: http://ntfy:8080
    # settings.env, then desk.env: CLAUDE_CODE_OAUTH_TOKEN, TIINGO_API_KEY, FINNHUB_API_KEY, FRED_API_KEY, DESK_SEC_USER_AGENT.
    env_file:
      - /mnt/Manifest/apps/vektor-desk/settings.env
      - /mnt/Manifest/apps/vektor-desk/desk.env
    volumes:
      - /mnt/Manifest/apps/vektor-desk/data:/data
      - /mnt/Manifest/apps/vektor-desk/firestore-reader.json:/run/secrets/firestore-reader:ro
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    healthcheck:
      test: ["CMD", "python", "-m", "desk.scheduler", "--check", "/app/deploy/crontab"]
      interval: 5m
      timeout: 10s
    # 640m on 16 GB of RAM; 2g after the upgrade to 32 GB.
    mem_limit: 640m

  # Phone alerts (docs/architecture.md): the desk publishes here, the phone subscribes at https://desk.escape-vektor.com:8443
  # over the tailnet, and ntfy.sh only relays a "poll now" wake-up to the iPhone app. Messages stay here for a week.
  ntfy:
    image: binwiederhier/ntfy:v2.33.1
    container_name: vektor-desk-ntfy
    restart: unless-stopped
    user: "568:568"
    command: ["serve"]
    environment:
      NTFY_BASE_URL: https://desk.escape-vektor.com:8443
      NTFY_UPSTREAM_BASE_URL: https://ntfy.sh
      NTFY_LISTEN_HTTP: ":8080"
      NTFY_CACHE_FILE: /var/lib/ntfy/cache.db
      NTFY_CACHE_DURATION: 168h
      NTFY_BEHIND_PROXY: "true"
      NTFY_AUTH_DEFAULT_ACCESS: read-write
      NTFY_LOG_LEVEL: warn
    volumes:
      - /mnt/Manifest/apps/vektor-desk/ntfy:/var/lib/ntfy
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    healthcheck:
      test: ["CMD-SHELL", "wget -q --tries=1 -O - http://localhost:8080/v1/health | grep -q true"]
      interval: 1m
      timeout: 5s
    mem_limit: 64m

  # The strategy lab (docs/statistics.md): runs queued experiment specs overnight (DESK_LAB_HOURS, 1-6 ET) with no network,
  # reading only data/lab/data/lab.db, which the engine's lab-export job writes at 00:55, and writing data/lab/runs/ledger.db.
  lab:
    image: vektor-desk:local
    pull_policy: never
    container_name: vektor-desk-lab
    restart: unless-stopped
    init: true
    user: "568:568"
    command: ["python", "-m", "desk.engine.lab"]
    network_mode: none
    # The image's health check calls the API, which a container with no network can't reach.
    healthcheck:
      disable: true
    environment:
      DESK_LAB_WORKERS: "3"
    volumes:
      - /mnt/Manifest/apps/vektor-desk/data/lab/data:/data/lab/data:ro
      - /mnt/Manifest/apps/vektor-desk/data/lab/queue:/data/lab/queue
      - /mnt/Manifest/apps/vektor-desk/data/lab/runs:/data/lab/runs
      - /mnt/Manifest/apps/vektor-desk/data/run:/data/run
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    # 3 CPUs and 1.5g on 16 GB of RAM; 8 CPUs, 8g and DESK_LAB_WORKERS 8 after the upgrade.
    cpus: 3
    mem_limit: 1536m

  # Claude evaluation access (docs/eval-access.md): a Remote Control session this project can drive. Reads the desk's data,
  # source and redacted logs read-only, and works on copies in eval/work. No keys, no Docker socket, and on its own network,
  # so it can't reach the API, ntfy or the tailnet.
  eval:
    image: vektor-desk:local
    pull_policy: never
    container_name: vektor-desk-eval
    hostname: vektor-desk-eval
    restart: unless-stopped
    init: true
    user: "568:568"
    working_dir: /work
    command: ["sh", "/src/deploy/eval/start.sh"]
    networks: [eval]
    healthcheck:
      disable: true
    environment:
      HOME: /home/eval
      DESK_DATA_DIR: /work/data
    volumes:
      - /mnt/Manifest/apps/vektor-desk/data:/data:ro
      - /mnt/Manifest/apps/vektor-desk-src:/src:ro
      - /mnt/Manifest/apps/vektor-desk/eval/home:/home/eval
      - /mnt/Manifest/apps/vektor-desk/eval/work:/work
    read_only: true
    # data/home is HOME for api, cron and lab: the desks' Claude config and transcripts. Masked with an empty, unwritable tmpfs.
    tmpfs:
      - /tmp
      - /data/home:size=64k,mode=0500
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    cpus: 2
    mem_limit: 1g

networks:
  eval: {}

# The Web UI button in TrueNAS Apps. TrueNAS reads this on install; deploy.sh card keeps it, and the icon, after edits.
x-portals:
  - name: Web UI
    scheme: https
    host: desk-lan.escape-vektor.com
    port: 443
    path: /

x-notes: |
  ## Vektor Desk

  Private investing desk for Escape Vektor. Tailnet only.

  - **Open:** https://desk.escape-vektor.com from a device on your tailnet, or https://desk-lan.escape-vektor.com at home
  - **Phone alerts:** ntfy app, server https://desk.escape-vektor.com:8443, topics desk-alerts, desk-research, desk-ops
  - **Status:** `sudo bash /mnt/Manifest/apps/vektor-desk-src/deploy/deploy.sh status`
  - **Deploy now:** `sudo bash /mnt/Manifest/apps/vektor-desk-src/deploy/deploy.sh now`
  - **Source:** https://github.com/inzodious/vektor-desk
